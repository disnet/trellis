name: Desktop build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the other platform's result.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (arm64)
            artifact: trellis-macos-arm64
            bundle: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: Windows (x64)
            artifact: trellis-windows-x64
            bundle: src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v4
      # This Node is the runtime the app ships, so pin it rather than inherit
      # whatever the runner image happens to carry.
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Select the Rust toolchain
        run: rustup default stable
      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: npm ci
      # Packages this OS's runtime and boots it, so a broken bundled server or
      # native addon fails here rather than inside an installer someone ran.
      - run: npm run test:desktop
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 14
