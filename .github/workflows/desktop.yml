name: Desktop build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the other platform's result.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (arm64)
            artifact: trellis-macos-arm64
            bundle: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: Windows (x64)
            artifact: trellis-windows-x64
            bundle: src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v4
      # This Node is the runtime the app ships, so pin it rather than inherit
      # whatever the runner image happens to carry.
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Select the Rust toolchain
        run: rustup default stable
      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: npm ci
      # The suite covers CLI discovery and process launching, which differ per
      # platform, so run it on the platform rather than trusting Linux for it.
      - run: npm test
      # Packages this OS's runtime and boots it, so a broken bundled server or
      # native addon fails here rather than inside an installer someone ran.
      - run: npm run test:desktop
      # The launcher's failure paths are plain Rust, so one platform is enough
      # to cover them; the release profile still compiles on both below.
      - name: Test the launcher
        if: runner.os == 'macOS'
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 14

  # Every green build on main becomes a downloadable release, so the README can
  # point at one stable link. It waits for both platforms: a release carrying
  # only half the installers would be worse than no new release at all.
  release:
    name: Release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Tauri names its bundles after the version, but the README links to
      # whatever is newest, so the download names have to stay put.
      - name: Name the installers after their platform
        run: |
          mkdir release
          cp artifacts/trellis-macos-arm64/*.dmg release/Trellis-macos-arm64.dmg
          cp artifacts/trellis-windows-x64/*.exe release/Trellis-windows-x64-setup.exe
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version-build.${{ github.run_number }}"
          # Re-running a build reuses its number, so top up that release
          # instead of failing on the tag it already published.
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --target "$GITHUB_SHA" \
              --title "Trellis $version (build ${{ github.run_number }})" \
              --latest \
              --notes "$(printf '%s\n' \
                "Automated build of [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/$GITHUB_SHA)." \
                '' \
                'Pre-alpha and unsigned. macOS blocks the first launch: open it from' \
                'the right-click menu, or run `xattr -dr com.apple.quarantine /Applications/Trellis.app`.' \
                'Windows SmartScreen needs More info, then Run anyway.')"
          fi
